<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your SleepOutside customer account." />
    <title>Sign Up | SleepOutside</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/signup.js"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products signup-page">
        <h1>Create your account</h1>
        <p>Sign up to create a customer profile for SleepOutside.</p>
        <form id="signup-form" class="checkout-form">
          <fieldset>
            <legend>Your information</legend>
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required maxlength="100" />

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" />

            <label for="address">Street address</label>
            <input id="address" name="address" type="text" autocomplete="street-address" required maxlength="200" />

            <label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required maxlength="100" />

            <label for="region">State, province, or region</label>
            <input id="region" name="region" type="text" autocomplete="address-level1" required maxlength="100" />

            <label for="postalCode">Postal code</label>
            <input id="postalCode" name="postalCode" type="text" autocomplete="postal-code" required maxlength="20" />

            <label for="avatar">Avatar image URL <span>(optional)</span></label>
            <input id="avatar" name="avatar" type="url" inputmode="url" placeholder="https://example.com/avatar.jpg" />
            <img id="avatar-preview" class="avatar-preview" alt="Avatar preview" hidden />
          </fieldset>
          <button id="signup-submit" type="submit">Create account</button>
          <p id="signup-message" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
